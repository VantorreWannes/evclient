[project]
name = "evclient"
version = "0.1.0"
description = "EasyVersion client: content-hashed workspace archives."
readme = "README.md"
authors = [{ name = "Wannes Vantorre", email = "vantorrewannes@gmail.com" }]
requires-python = ">=3.14"
dependencies = [
    "aiohttp>=3.14.4",
    "dill>=0.4.1",
    "pydantic>=2.13.4",
]

[project.scripts]
ev = "evclient.cli:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[tool.uv.sources]
evserver = { path = "../evserver", editable = true }

[dependency-groups]
dev = ["evserver", "pytest>=9.1.1", "ruff>=0.16.0", "ty>=0.0.64"]
